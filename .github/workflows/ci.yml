name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with: {python-version: "3.13"}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q --basetemp=.pytest_tmp/run
  # eval 门禁（spec §17 M8）：指标劣化会被拦住——拦截率 <90% 或误伤率 >5% 即红。
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with: {python-version: "3.13"}
      - run: uv sync --frozen
      - run: uv run python -m guardrail eval
      - run: uv run python -m guardrail eval-corp
      - run: uv run python -m guardrail eval-bench
